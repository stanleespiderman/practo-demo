<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Practo · Mobile design review</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eff0f6;
        color: #28328c;
        font-family: Arial, sans-serif;
      }
      header {
        padding: 24px 35px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #dddfe9;
      }
      h1 {
        font-size: 19px;
        margin: 0;
      }
      header p {
        font-size: 12px;
        color: #84889e;
      }
      a {
        color: #28328c;
        font-size: 12px;
      }
      main {
        display: flex;
        gap: 28px;
        justify-content: center;
        padding: 25px;
        overflow-x: auto;
      }
      .device {
        flex-shrink: 0;
      }
      h2 {
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 1.5px;
        margin: 0 0 13px;
        text-align: center;
        color: #8c90a3;
      }
      iframe {
        width: 390px;
        height: 720px;
        border: 7px solid white;
        border-radius: 24px;
        box-shadow: 0 10px 45px #28328c15;
        background: white;
      }
      footer {
        text-align: center;
        color: #8c90a3;
        font-size: 10px;
        padding: 0 25px 25px;
      }
      @media (max-width: 700px) {
        main {
          justify-content: flex-start;
        }
        header {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Practo · Mobile design review</h1>
        <p>Interactive browser previews of the Android design · Local demo</p>
      </div>
      <a href="index.html">Open full preview →</a>
    </header>
    <main>
      <section class="device">
        <h2>01 · Home</h2>
        <iframe title="Home screen" src="index.html#home"></iframe>
      </section>
      <section class="device">
        <h2>02 · Consultations</h2>
        <iframe
          title="Consultation list"
          src="index.html#consultations"
        ></iframe>
      </section>
      <section class="device">
        <h2>03 · Conversation</h2>
        <iframe
          title="Consultation chat"
          src="index.html#chat/DEMO-10482"
        ></iframe>
      </section>
    </main>
    <footer>
      Web review only · Native Kotlin source is supplied separately · APK
      creation awaits approval
    </footer>
  </body>
</html>
